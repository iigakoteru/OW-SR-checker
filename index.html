<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OW2 スクリムSR計算ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f2f4f9;--surface:#fff;--s2:#eef1f8;--line:#d9dfec;--text:#18203a;--muted:#5d6985;--accent:#d97f00;--a:#2f7de1;--b:#e0485a;--ok:#12935a;--warn:#c27a00;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2e;--surface:#1a2742;--s2:#233459;--line:#375080;--text:#eef1f8;--muted:#93a0bd;--accent:#f99e1a;--a:#5aa3ff;--b:#ff6677;--ok:#3ddc97;--warn:#ffb340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a2e;--surface:#1a2742;--s2:#233459;--line:#375080;--text:#eef1f8;--muted:#93a0bd;--accent:#f99e1a;--a:#5aa3ff;--b:#ff6677;--ok:#3ddc97;--warn:#ffb340;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Noto Sans JP',system-ui,sans-serif;padding:0 14px 48px}
.num{font-family:'Teko',sans-serif;letter-spacing:.5px}
header{margin:0 -14px 20px;padding:16px 14px 14px;background:linear-gradient(180deg,#16233f,#0f1a2e);border-bottom:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;color:#fff}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 130% at 0% 0%,rgba(79,160,255,.2),transparent 70%);pointer-events:none}
.hin{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;position:relative}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;filter:drop-shadow(0 0 6px rgba(249,158,26,.35))}
.eb{display:block;font:500 12px/1 'Teko',sans-serif;letter-spacing:.34em;color:var(--accent);margin-bottom:7px}
h1{margin:0;font:500 26px/1 'Teko',sans-serif;letter-spacing:.14em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
h1 small{display:block;font:400 11px 'Noto Sans JP',sans-serif;letter-spacing:.04em;font-style:normal;text-transform:none;color:#bcd8f5;margin-top:6px}
header .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
header .seg button{color:#c3cdea}
header .seg button.on{color:#1a1200}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:700 13px inherit;font-family:inherit;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#1a1200}
main{max-width:1100px;margin:0 auto}
#stage{padding:2px}
.vs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.vs-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .big{font-size:52px;line-height:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.badge{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:900;border:1px solid currentColor}
.prob{margin:16px 0 4px;height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--s2)}
.prob i{display:block;height:100%}
.probt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.mu{margin-top:14px;display:grid;gap:6px}
.mu div{display:grid;grid-template-columns:70px 1fr 56px 1fr 70px;gap:8px;align-items:center;font-size:12px;font-weight:700}
.mu .l{text-align:right}.mu .r{text-align:left}
.mu .bar{height:8px;background:var(--s2);border-radius:4px;position:relative;overflow:hidden}
.mu .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.teams{display:grid;gap:16px;grid-template-columns:1fr}
.teams.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:inset 0 2px 0 var(--tc,var(--accent)),0 8px 24px rgba(0,0,0,.12)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch h2{margin:0;font-size:17px;font-weight:900}
.btn{border:1px solid var(--line);background:var(--s2);color:var(--text);font:700 12px inherit;font-family:inherit;padding:6px 11px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1200}
.row{display:grid;grid-template-columns:100px 1fr 1fr 62px 52px;gap:6px;align-items:center;padding:8px 10px;margin-bottom:6px;background:var(--s2);border-radius:8px;border-left:3px solid var(--c)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ri{width:20px;height:20px;object-fit:contain;margin-right:6px;vertical-align:-5px}
.row .role{font-weight:700;font-size:12px}
input,select{font:inherit;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px;min-width:0;width:100%}
.row .sr{text-align:right;font-size:22px;line-height:1;color:var(--c)}
.name{grid-column:2/4}
.row .name{grid-column:auto}
.tr{position:relative;height:22px;margin:12px 6px 4px;background:linear-gradient(90deg,var(--s2),var(--line));border-radius:99px}
.tr i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;margin-left:-8px;border:2px solid var(--surface)}
.avg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.avg .big{font-size:56px;line-height:.9}
.rk{font-weight:900;font-size:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;text-align:center}
.grid4 div{background:var(--s2);border-radius:10px;padding:6px 2px}
.grid4 b{display:block;font-size:24px;line-height:1.1}
.note{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .in{background:var(--surface);border-radius:14px;max-width:760px;width:100%;padding:12px;max-height:90vh;display:flex;flex-direction:column;gap:8px}
#modal .imgw{overflow:auto}#modal img{max-width:100%;border-radius:8px}
@media(max-width:560px){
.row{grid-template-columns:1fr 1fr 1fr 52px}.row .role{grid-column:1/3}.row .sr{grid-column:3/5}
.row .name{grid-column:1/3}
.vs .big{font-size:38px}.mu div{grid-template-columns:54px 1fr 48px 1fr 54px}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand">
  <h1><span class="eb">Overwatch 2</span>Scrim <em>SR</em> Calculator<small>ロールごとにランクを選ぶだけ。平均SRと対戦バランスを自動計算</small></h1></div>
  <div class="seg"><button id="m-single" onclick="setMode('single')">単一チーム</button><button id="m-vs" onclick="setMode('vs')">A vs B</button></div>
</div></header>
<main>
  <div class="btns" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px">
    <button class="btn pri" onclick="capture()">📸 画像として保存</button>
  </div>
  <div id="stage">
    <section id="vs" class="vs hide"></section>
    <div id="teams" class="teams"></div>
  </div>
</main>
<div id="modal" class="hide" onclick="this.classList.add('hide')"><div class="in" onclick="event.stopPropagation()">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">画像を長押しして保存してください</b><button class="btn" onclick="document.getElementById('modal').classList.add('hide')">閉じる</button></div>
  <div class="imgw" id="modalImg"></div></div></div>

<script>
const TIERS=[["ブロンズ",0,"#b0764a"],["シルバー",1500,"#9aa6b4"],["ゴールド",2000,"#e0ae1d"],["プラチナ",2500,"#3fb6bb"],["エメラルド",3000,"#2ecc71"],["ダイヤモンド",3500,"#4f94f5"],["マスター",4000,"#b46cf0"],["グランドマスター",4500,"#f0607a"],["チャンピオン",5000,"#f99e1a"]];
const ROLES=[["🛡️","タンク","t"],["⚔️","DPS 1","d"],["⚔️","DPS 2","d"],["💚","サポート 1","s"],["💚","サポート 2","s"]];
const KEY="ow2-scrim-sr-v2";
// ロールアイコン: HTMLと同じ階層の images/tank.png, dps.png, support.png を読み込む（無ければ色付きドットを表示）
const IMG={t:["tank","#4f9dff"],d:["dps","#ff6677"],s:["support","#3ddc97"]};
const icon=k=>`<img class="ri" src="images/${IMG[k][0]}.png" data-c="${IMG[k][1]}" alt="" onerror="this.replaceWith(dotEl(this.dataset.c))">`;
function dotEl(c){const i=document.createElement("i");i.className="dot";i.style.background=c;return i}
const def=()=>({mode:"single",A:ROLES.map(()=>({n:"",sr:2500})),B:ROLES.map(()=>({n:"",sr:2500}))});
let S=def();
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.A&&x.B)S=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const toSR=(t,d)=>t===8?5000:TIERS[t][1]+(5-d)*100;
function fromSR(sr){let t=0;TIERS.forEach((x,i)=>{if(sr>=x[1])t=i});return{t,d:t===8?1:Math.max(1,5-Math.floor((sr-TIERS[t][1])/100))}}
const rankName=sr=>{const{t,d}=fromSR(sr);return t===8?"チャンピオン":TIERS[t][0]+" "+d};
const rankColor=sr=>TIERS[fromSR(sr).t][2];
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function stats(k){const v=S[k].map(p=>p.sr),s=[...v].sort((a,b)=>a-b);
  return{v,avg:Math.round(mean(v)),med:s[2],max:s[4],min:s[0],spread:s[4]-s[0]}}

function teamHTML(k){
  const st=stats(k),tc=k==="A"?"var(--a)":"var(--b)";
  const title=S.mode==="single"?"チーム編成":"TEAM "+k;
  const rows=S[k].map((p,i)=>{const{t,d}=fromSR(p.sr),r=ROLES[i];
    return `<div class="row" style="--c:${TIERS[t][2]}">
    <span class="role">${icon(r[2])}${r[1]}</span>
    <input class="name" data-k="${k}" data-i="${i}" value="${p.n.replace(/"/g,"&quot;")}" placeholder="名前(任意)" maxlength="12">
    <select data-k="${k}" data-i="${i}" data-f="t">${TIERS.map((x,j)=>`<option value="${j}"${j===t?" selected":""}>${x[0]}</option>`).join("")}</select>
    <select data-k="${k}" data-i="${i}" data-f="d"${t===8?" disabled":""}>${[5,4,3,2,1].map(n=>`<option${n===d?" selected":""}>${n}</option>`).join("")}</select>
    <span class="sr num">${p.sr}</span></div>`}).join("");
  const dots=st.v.map(v=>`<i style="left:${v/50}%;background:${rankColor(v)}"></i>`).join("");
  return `<section class="card" style="--tc:${tc}">
  <div class="ch"><h2>${title}</h2><span data-html2canvas-ignore><button class="btn" onclick="resetTeam('${k}')">リセット</button></span></div>
  ${rows}
  <div class="tr" title="0〜5000SRの分布">${dots}</div>
  <div class="avg"><div><div class="lbl">チーム平均</div><div class="rk" style="color:${rankColor(st.avg)}">${rankName(st.avg)} 相当</div></div><div class="big num">${st.avg}<span style="font-size:16px;color:var(--muted)"> SR</span></div></div>
  <div class="grid4"><div><span class="lbl">中央値</span><b class="num">${st.med}</b></div><div><span class="lbl">最高</span><b class="num" style="color:var(--ok)">${st.max}</b></div><div><span class="lbl">最低</span><b class="num" style="color:var(--b)">${st.min}</b></div><div><span class="lbl">格差</span><b class="num">${st.spread}</b></div></div>
  </section>`}

function vsHTML(){
  const a=stats("A"),b=stats("B"),diff=Math.abs(a.avg-b.avg);
  let col="var(--ok)",txt="VERY FAIR（非常に良い勝負）";
  if(diff>250){col="var(--warn)";txt="SR GAP（格差あり）"}else if(diff>100){col="var(--a)";txt="GOOD SCRIM（適正）"}
  const pa=1/(1+Math.pow(10,-(a.avg-b.avg)/400));
  const pairs=[["タンク",[0]],["DPS",[1,2]],["サポート",[3,4]]];
  const mu=pairs.map(([n,ix])=>{const x=mean(ix.map(i=>S.A[i].sr)),y=mean(ix.map(i=>S.B[i].sr)),d=x-y,w=Math.min(50,Math.abs(d)/10);
    const bar=(side)=>`<div class="bar"><i style="${side==="l"?"right:0":"left:0"};width:${(side==="l"&&d>0)||(side==="r"&&d<0)?w*2:0}%;background:${side==="l"?"var(--a)":"var(--b)"}"></i></div>`;
    return `<div><span class="l num" style="font-size:16px">${Math.round(x)}</span>${bar("l")}<span style="text-align:center;color:var(--muted)">${n}<br><span class="num" style="font-size:13px;color:var(--text)">${d===0?"±0":(d>0?"A +":"B +")+Math.abs(Math.round(d))}</span></span>${bar("r")}<span class="r num" style="font-size:16px">${Math.round(y)}</span></div>`}).join("");
  return `<div class="vs-head">
    <div><div class="lbl" style="color:var(--a)">TEAM A 平均</div><div class="big num">${a.avg}</div><div class="rk" style="color:${rankColor(a.avg)}">${rankName(a.avg)}</div></div>
    <div><div class="lbl">平均SR差</div><div class="big num" style="color:var(--accent)">${diff}</div><span class="badge" style="color:${col}">${txt}</span></div>
    <div><div class="lbl" style="color:var(--b)">TEAM B 平均</div><div class="big num">${b.avg}</div><div class="rk" style="color:${rankColor(b.avg)}">${rankName(b.avg)}</div></div></div>
  <div class="prob"><i style="width:${pa*100}%;background:var(--a)"></i><i style="width:${(1-pa)*100}%;background:var(--b)"></i></div>
  <div class="probt"><span>A ${(pa*100).toFixed(0)}%</span><span>SR差からの勝率の目安</span><span>${((1-pa)*100).toFixed(0)}% B</span></div>
  <div class="mu">${mu}</div>`}

function render(){
  const vs=S.mode==="vs";
  document.getElementById("m-single").className=vs?"":"on";
  document.getElementById("m-vs").className=vs?"on":"";
  const v=document.getElementById("vs");v.classList.toggle("hide",!vs);
  if(vs)v.innerHTML=vsHTML();
  const t=document.getElementById("teams");t.className="teams"+(vs?" two":"");
  t.innerHTML=teamHTML("A")+(vs?teamHTML("B"):"");
}
function setMode(m){S.mode=m;save();render()}
function resetTeam(k){S[k]=ROLES.map(()=>({n:"",sr:2500}));save();render()}

document.addEventListener("change",e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const{k,i}=el.dataset,row=el.closest(".row"),sel=row.querySelectorAll("select");
  const t=+sel[0].value,d=+sel[1].value;
  S[k][+i].sr=toSR(t,d);save();render();
});
document.addEventListener("input",e=>{
  const el=e.target;if(!el.classList.contains("name"))return;
  S[el.dataset.k][+el.dataset.i].n=el.value;save();
});

const isMobile=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>2);
function capture(){
  const el=document.getElementById("stage");
  const bg=getComputedStyle(document.body).backgroundColor;
  html2canvas(el,{backgroundColor:bg,scale:2,useCORS:true}).then(c=>{
    const url=c.toDataURL("image/png");
    if(isMobile()){
      document.getElementById("modalImg").innerHTML='<img src="'+url+'" alt="結果画像">';
      document.getElementById("modal").classList.remove("hide");
    }else{
      const a=document.createElement("a");a.download="OW2_Scrim_SR.png";a.href=url;
      document.body.appendChild(a);a.click();a.remove();
    }
  }).catch(err=>alert("画像の生成に失敗しました: "+err));
}
render();
</script>
</body>
</html>
